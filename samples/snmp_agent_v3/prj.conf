# =============================================================================
# SNMPv3 validation sample configuration
#
# Every credential below is a **public test value** that ships in this repository.
# They exist so that a developer can reproduce an authenticated, encrypted SNMPv3
# exchange without generating keys first. Never copy them into a product image.
# =============================================================================

# Networking configuration
CONFIG_NETWORKING=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_IPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.68.102"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# DHCPv4 client (dynamic IP with the static address above as fallback)
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2

# Network management & logging
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# Hardware peripherals (LED & user button)
CONFIG_GPIO=y

# SNMP subsystem configuration
CONFIG_SNMP_AGENT=y
CONFIG_SNMP_AGENT_PORT=161
CONFIG_SNMP_COMMUNITY_READ="public"
CONFIG_SNMP_COMMUNITY_WRITE="private"

# v3 is the point of this sample; v2c stays enabled so the same build can be used
# to compare v2c and v3 behaviour against one agent instance.
CONFIG_SNMP_VERSION_3=y
CONFIG_SNMP_VERSION_2C=y
CONFIG_SNMP_RATE_LIMIT=n

# --- Test-only USM identity -------------------------------------------------
# authPriv user: HMAC-SHA-256 authentication + AES-128-CFB privacy.
# This user maps to VACM group "admin" (fullView) in src/snmp_vacm.c.
CONFIG_SNMP_V3_USER_NAME="v3test"
CONFIG_SNMP_V3_AUTH_PASS="v3-auth-passphrase-test-only"
CONFIG_SNMP_V3_PRIV_PASS="v3-priv-passphrase-test-only"
# 0=none 1=SHA-1 2=MD5 3=SHA-256
CONFIG_SNMP_V3_AUTH_PROTOCOL=3
# 0=none 1=AES-128-CFB
CONFIG_SNMP_V3_PRIV_PROTOCOL=1
CONFIG_SNMP_V3_ENGINE_BOOTS=1
CONFIG_SNMP_V3_MAX_USERS=4

# --- Notifications ----------------------------------------------------------
CONFIG_SNMP_TRAP_ENABLED=y
CONFIG_SNMP_TRAP_PORT=162
CONFIG_SNMP_TRAP_FORMAT_V3=y
CONFIG_SNMP_TRAP_V3_USER="v3test"

# Sample application options
CONFIG_SNMP_SAMPLE_ENTERPRISE_ID=54321
CONFIG_SNMP_SAMPLE_SENSOR_OBJECT=y
CONFIG_SNMP_SAMPLE_LED_OBJECT=y
CONFIG_SNMP_SAMPLE_BUTTON_TRAP=y
CONFIG_SNMP_SAMPLE_TRAP_DEST="192.168.68.103"
CONFIG_SNMP_SAMPLE_V3_MONITOR_USER="v3monitor"
CONFIG_SNMP_SAMPLE_V3_MONITOR_AUTH_PASS="v3-monitor-auth-passphrase-test-only"

# --- Stack sizing -----------------------------------------------------------
# The v3 receive path runs inside the socket-service thread and holds one decoded
# struct snmp_v3_msg (plus the AES plaintext/ciphertext buffers) on its stack, so
# 4 KiB is not enough. Kconfig asks for >= 12 KiB whenever v3 or GetBulk is on.
# The shell and workqueue threads also need >= 16 KiB to send v3 traps safely.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_SHELL_STACK_SIZE=16384

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SNMP_LOG_LEVEL_INF=y

# Interactive shell over UART
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
