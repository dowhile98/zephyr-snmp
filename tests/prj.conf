CONFIG_ZTEST=y
CONFIG_LOG=y

# Networking dependencies for snmp module
CONFIG_NETWORKING=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_IPV4=y

# SNMP Subsystem
CONFIG_SNMP_AGENT=y
CONFIG_SNMP_VERSION_1=y
CONFIG_SNMP_VERSION_2C=y
CONFIG_SNMP_VERSION_3=y
CONFIG_SNMP_MAX_INSTANCES=2
CONFIG_ZVFS_POLL_MAX=5
CONFIG_SNMP_MAX_MIB_NODES=128
CONFIG_SNMP_MAX_TABLES=8
CONFIG_SNMP_MAX_IFACES=8

CONFIG_MAIN_STACK_SIZE=4096

# The v3 receive path keeps a decoded struct snmp_v3_msg (~8.8 KiB with the default
# CONFIG_SNMP_MAX_PDU_SIZE) plus the plaintext/ciphertext scratch on the stack, and the
# USM tests hold two such messages at once. The ztest thread stack must cover that.
CONFIG_ZTEST_STACK_SIZE=32768
